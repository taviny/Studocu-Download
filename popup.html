<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studocu Download</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <img src="icons/icon128.png" alt="Logo" class="app-logo">
      <div class="header-text">
        <div class="brand-title">Studocu Download</div>
        <div class="brand-sub">@vny.</div>
      </div>
    </header>

    <button id="btn-export-a4" class="hero-button">
      <div class="hero-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </div>
      <div class="hero-text">
        <div class="hero-title">Quét & Xuất PDF</div>
        <div class="hero-subtitle">Tự động cuộn 100% • Khổ A4</div>
      </div>
    </button>

    <div class="action-grid">
      <button id="btn-unblur" class="grid-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        <div class="grid-text">
          <div class="grid-title">Gỡ Mờ</div>
          <div class="grid-subtitle">Mở khóa tài liệu</div>
        </div>
      </button>

      <button id="btn-reload" class="grid-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <div class="grid-text">
          <div class="grid-title">Làm Mới</div>
          <div class="grid-subtitle">Xóa cookies & F5</div>
        </div>
      </button>
    </div>

    <footer class="app-footer">
      <div class="status-wrapper">
        <span class="dot"></span>
        <span id="status-text">Đang kết nối...</span>
      </div>
      <div class="author-tag">@vny.</div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
